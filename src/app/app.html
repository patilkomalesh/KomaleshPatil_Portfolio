<!-- Ambient light behind everything. Its colour follows the section in view. -->
<div class="ambient" aria-hidden="true">
  <span class="ambient__a"></span>
  <span class="ambient__b"></span>
</div>

<div class="progress" aria-hidden="true" [style.transform]="'scaleX(' + scroll.progress() + ')'"></div>

<header class="nav" [class.nav--hidden]="scroll.scrollingDown()" [class.nav--top]="scroll.atTop()">
  <a href="#top" class="nav__mark" aria-label="Back to top">KP</a>
  <nav aria-label="Sections">
    @for (item of nav; track item.id) {
      <a [href]="'#' + item.id">{{ item.label }}</a>
    }
  </nav>
  <button
    type="button"
    class="nav__theme"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.active().scheme === 'dark' ? 'Use light theme' : 'Use dark theme'"
  >
    @if (theme.active().scheme === 'dark') {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
      </svg>
    }
  </button>
  <a href="#contact" class="nav__contact">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2.5" />
      <path d="m4 7 8 6 8-6" />
    </svg>
    <span>Contact</span>
  </a>
</header>

@if (content(); as c) {
  <main class="page" #main>
    <app-hero [content]="c" [resumeUrl]="resumeUrl" />
    <app-work [jobs]="c.experience" />
    <app-projects [projects]="c.projects" />
    <app-skills [groups]="c.skills" />
    <app-background [content]="c" />
    <app-contact [person]="c.person" [resumeUrl]="resumeUrl" />
  </main>

  <footer class="page footer">
    <span>&copy; {{ year }} {{ c.person.name }}</span>
    <a href="#top">Back to top</a>
  </footer>
}
